# Render Blueprint - https://render.com/docs/blueprint-spec
# Auto-deploys the SafeRoad Angular UI as a static site on every push to main.
# Backend API lives at https://saferoad-api-3vfl.onrender.com (configured in
# src/environments/environment.prod.ts).

services:
  - type: web
    name: saferoad-ui
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist/saferoad-ui/browser
    autoDeploy: true
    pullRequestPreviewsEnabled: true

    envVars:
      - key: NODE_VERSION
        value: "22.12.0"

    # SPA fallback so client-side routes resolve to index.html
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
