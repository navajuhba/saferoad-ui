<div class="app-wrapper">
  <!-- Toaster Notifications -->
  <app-toaster></app-toaster>
  
  <!-- Header (shown only when not on login/register pages) -->
  <app-header 
    *ngIf="showHeaderSidebar()" 
    (toggleSidebar)="onToggleSidebar()">
  </app-header>
  
  <div class="app-main">
    <!-- Sidebar (shown only when not on login/register pages) -->
    <app-sidebar *ngIf="showHeaderSidebar()"></app-sidebar>
    
    <!-- Main content area -->
    <main class="app-content" [class.full-width]="!showHeaderSidebar()">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
